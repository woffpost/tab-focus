<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Tab Focus</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <form id="start">
    <label for="topic">На чём фокусируемся?</label>
    <input id="topic" placeholder="например, AI-агенты, LLM, Claude API" autocomplete="off" maxlength="80" required autofocus />
    <p class="hint">Опиши предмет, а не цель: точнее работает «AI-агенты, LLM», чем «хочу стать AI Engineer».</p>
    <button type="submit">Включить фокус</button>
    <button type="button" id="suggest" class="quiet">Предложить темы из вкладок</button>
    <ul id="suggestions"></ul>
    <p id="no-suggestions" class="hint" hidden>Явных тем не нашлось: вкладки слишком разные. Опиши тему сам.</p>
  </form>

  <section id="session" hidden>
    <div class="row">
      <strong id="current-topic"></strong>
      <button id="stop" class="quiet">Выйти</button>
    </div>
    <div id="verdict" hidden>
      <p id="verdict-text" role="status"></p>
      <div class="row">
        <button id="mark-on" class="quiet">Это по теме</button>
        <button id="mark-off" class="quiet">Убрать</button>
      </div>
    </div>
    <label class="threshold">Порог <output id="threshold-value"></output>
      <input id="threshold" type="range" min="0.05" max="0.8" step="0.01" />
    </label>
    <ul id="tabs"></ul>
  </section>

  <p id="status" role="status" hidden></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
