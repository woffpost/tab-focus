<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Tab Focus</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <form id="start">
    <label for="topic" data-i18n="topicLabel"></label>
    <input id="topic" data-i18n-placeholder="topicPlaceholder" autocomplete="off" maxlength="80" required autofocus />
    <p class="hint" data-i18n="topicHint"></p>
    <button type="submit" data-i18n="startButton"></button>
    <button type="button" id="suggest" class="quiet" data-i18n="suggestButton"></button>
    <ul id="suggestions"></ul>
    <p id="no-suggestions" class="hint" data-i18n="noSuggestions" hidden></p>
  </form>

  <section id="session" hidden>
    <div class="row">
      <strong id="current-topic"></strong>
      <button id="stop" class="quiet" data-i18n="stopButton"></button>
    </div>
    <div id="verdict" hidden>
      <p id="verdict-text" role="status"></p>
      <div class="row">
        <button id="mark-on" class="quiet" data-i18n="markOnButton"></button>
        <button id="mark-off" class="quiet" data-i18n="markOffButton"></button>
      </div>
    </div>
    <label class="threshold"><span data-i18n="thresholdLabel"></span> <output id="threshold-value"></output>
      <input id="threshold" type="range" min="0.05" max="0.8" step="0.01" />
    </label>
    <div id="lists">
      <h2><span data-i18n="sectionOn"></span> <span id="on-count" class="count"></span></h2>
      <ul id="tabs-on" class="tabs"></ul>
      <h2><span data-i18n="offGroupTitle"></span> <span id="off-count" class="count"></span></h2>
      <ul id="tabs-off" class="tabs"></ul>
    </div>
  </section>

  <p id="status" role="status" hidden></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
